name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # Pinned ruff, so a new ruff release cannot turn CI red without a code change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.17.5
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  unit:
    # Unit tests on every supported Python with the latest compatible dependencies.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest

