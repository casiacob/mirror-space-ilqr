name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the regression test exports the original commit effb14c

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install (pinned)
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -m "not slow"

      # XLA compiles for the host CPU, so the golden outputs are regenerated from the
      # original code on this runner and the new code is compared with them bitwise.
      - name: Regression against the original implementation
        env:
          MSILQR_RECAPTURE_GOLDEN: "1"
        run: pytest -m slow
