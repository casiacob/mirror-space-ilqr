[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msilqr"
version = "1.0.0.dev0"
description = "Mirror-space iLQR: dynamic programming for optimal control with convex control constraints"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Casian Iacob" },
    { name = "Hany Abdulsamad" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jax>=0.12",  # tested with 0.12.0.1 (requirements-lock.txt)
    "numpy>=2.0",
]

[project.optional-dependencies]
# Newton inverse map of the polytope DGF (PolytopeLogBarrier)
polytope = ["optimistix>=0.0.10"]
# benchmark runner, figures and the regression workflow
benchmarks = ["optimistix>=0.0.10", "matplotlib>=3.8"]
dev = ["optimistix>=0.0.10", "matplotlib>=3.8", "pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["msilqr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end regression against the original implementation (~1 min)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]  # l is a natural name for a pole length

[tool.ruff.lint.per-file-ignores]
"benchmarks/run.py" = ["E402"]
# `common` must be imported first: it sets up sys.path and float64 for the other imports
"benchmarks/experiments/*.py" = ["I001", "E402"]
